    var u=document.createElement('div'); u.className='urg'; u.textContent='⏳ Launch price $'+PRICE+' — this round only. It goes back up after.'; cnote.parentNode.insertBefore(u,cnote.nextSibling);
    window.__kit=1;
    function kitPrice(){ return (window.__kit===2)? (parseFloat(PRICE)*2*(1-KIT2_OFF)) : parseFloat(PRICE); }
    function syncCTA(){ var base=kitPrice(); ctaBtn.textContent = (window.__kit===2? "Get 2 bottles for $"+base.toFixed(2) : "Reconnect for $"+PRICE)+" →"; }
    Array.prototype.forEach.call(scr.querySelectorAll('.kitopt'),function(o){
      o.onclick=function(){
        Array.prototype.forEach.call(scr.querySelectorAll('.kitopt'),function(x){x.classList.remove('sel');});
        o.classList.add('sel'); window.__kit=parseInt(o.getAttribute('data-kit'),10)||1; syncCTA();
      };
    });
    ctaBtn.onclick=function(){
      var two=window.__kit===2; var qty=two?2:1;
      var val=kitPrice();
      try{ if(window.fbq) fbq('track','InitiateCheckout',{value:val,currency:'USD'}); }catch(e){}
      var items=MAIN_VARIANT+":"+qty;
      var url=CART_BASE+items;
      var qs=[]; if(two){ qs.push('discount='+KIT2_CODE); }
      try{ var rtk=window.__rtkcid||''; if(rtk){ qs.push('attributes[rtkcid]='+encodeURIComponent(rtk)); } }catch(e){}
      qs.push('attributes[lp]=afterglow'); if(location.search){ qs.push(location.search.slice(1)); }
      if(qs.length){ url+='?'+qs.join('&'); }
      location.href=url;
    };
    return;
  }
}
function gline(e,t,p,v){ return '<div class="gline"><span class="ge">'+e+'</span><div><b>'+t+'</b><p>'+p+'</p></div>'+(v?'<span class="gv">'+v+'</span>':'')+'</div>'; }
function faq(q,a){ return '<details><summary>'+q+'</summary><p>'+a+'</p></details>'; }
function rvw(ini,name,title,body){ return '<div class="rvw"><div class="rtop"><div class="av">'+ini+'</div><div><div class="nm">'+name+'</div><div class="stars">★★★★★</div></div></div><div class="rt">'+title+'</div><div class="rb">'+body+'</div><span class="vp">✔ Verified buyer</span><div class="src">United States</div></div>'; }

setEarn(0); render();
</script>
