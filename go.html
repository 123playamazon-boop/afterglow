<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Afterglow</title>
<style>
html,body{margin:0;height:100%;background:#fdf4ee;font-family:system-ui,-apple-system,sans-serif}
.c{position:fixed;inset:0;display:flex;align-items:center;justify-content:center}
.s{width:42px;height:42px;border:4px solid #f0d9cf;border-top-color:#a8365f;border-radius:50%;animation:sp 1s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<div class="c"><div class="s"></div></div>
<script>
/* ===== Afterglow A/B splitter — 50/50 quiz vs DTC =====
   - A = quiz   (index, lp=afterglow)
   - B = dtc    (dtc.html, lp=afterglow-dtc)
   - Sticky per visitor (localStorage) so a return visit sees the same page.
   - Carries the full query string (rtkcid/clickid/utm/fbclid) through the redirect.
   - Optional overrides for testing: ?ab=a or ?ab=b forces a variant. */
(function(){
  var DEST = { a: "/", b: "/dtc.html" };
  var qs = location.search || "";
  var params = new URLSearchParams(qs);

  // forced override for QA
  var forced = (params.get("ab")||"").toLowerCase();
  params.delete("ab"); // don't carry the override forward

  var v;
  if(forced==="a"||forced==="b"){ v=forced; }
  else{
    try{ v = localStorage.getItem("ag_ab"); }catch(e){ v=null; }
    if(v!=="a" && v!=="b"){
      v = (Math.random()<0.5) ? "a" : "b";
      try{ localStorage.setItem("ag_ab", v); }catch(e){}
    }
  }

  var carry = params.toString();
  var url = DEST[v] + (carry ? ("?"+carry) : "");
  location.replace(url);
})();
</script>
<noscript>
  <meta http-equiv="refresh" content="0;url=/dtc.html">
</noscript>
</body>
</html>
